[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-toolkit"
version = "0.1.0"
description = "Provider-portable workflows for AI-assisted software delivery"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Joe Li"}]
dependencies = []

[project.scripts]
aitk = "aitk.cli:main"

[tool.setuptools]
packages = ["aitk"]
