name: Validate toolkit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generate path-resolved build output
        run: bin/aitk build --with-pgm
      - name: Run the complete conformance gate
        run: bin/aitk check
      - name: Reject whitespace errors
        run: git diff --check
      - name: Build an isolated wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Smoke test the installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/aitk-smoke"
          "$RUNNER_TEMP/aitk-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aitk-smoke/bin/aitk" --root "$GITHUB_WORKSPACE" list --json
